<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>冰屿 AI 档案馆</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b121c;color:#e7eff8;font:14px/1.6 system-ui,"Noto Sans SC",sans-serif}.app{display:grid;grid-template-columns:230px 330px 1fr;min-height:100vh}.side,.list{background:#101b29;border-right:1px solid #29394d;padding:18px}.side{display:flex;flex-direction:column;gap:14px}.brand{font-size:17px;font-weight:700;color:#eafaff;padding:8px}.brand span{color:#42d8f2}.muted{color:#8da3ba;font-size:12px}.btn,input,select{font:inherit;border:1px solid #30445a;border-radius:9px;padding:10px;background:#172638;color:#e7eff8}.btn{cursor:pointer}.primary{background:#087f9b;border:0}.nav button{display:block;width:100%;text-align:left;margin:5px 0}.bottom{margin-top:auto;display:grid;gap:8px}.list{padding:20px 12px}.list h2{margin:0 8px 12px}.search{width:100%;background:#09131f}.entry{padding:12px;border-radius:10px;margin:5px 0;cursor:pointer;border:1px solid transparent}.entry:hover,.entry.active{background:#1a3043;border-color:#2c586d}.entry small{display:block;color:#8da3ba}.reader{padding:22px 5%;height:100vh;overflow:auto}.reader header{display:flex;gap:8px;align-items:center;border-bottom:1px solid #29394d;padding-bottom:14px}.reader h1{font-size:18px;flex:1}.msg{display:grid;grid-template-columns:38px 1fr;gap:12px;margin:25px 0}.avatar{background:#1a3a4c;border-radius:10px;padding:7px;height:34px}.content{line-height:1.85;overflow-wrap:anywhere}.content pre{background:#060b12;padding:14px;border-radius:9px;overflow:auto}.content img{max-width:100%}.empty{text-align:center;color:#8da3ba;padding:50px 15px}.tag{display:inline-block;background:#16404b;color:#9ce5f0;padding:2px 8px;border-radius:20px;margin:3px}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center}.modal.show{display:grid}.modal section{background:#142235;padding:22px;border-radius:14px;width:min(420px,90vw)}@media(max-width:800px){.app{grid-template-columns:1fr}.side{min-height:auto}.bottom{display:flex;flex-wrap:wrap}.list{max-height:40vh}.reader{height:auto;min-height:60vh}}
.htmlnote{padding:12px;background:#142b3d;border:1px solid #31556d;border-radius:9px;margin:0 0 18px}.htmlnote .btn{margin-left:8px}.content{overflow-wrap:anywhere}.content img{max-width:100%;height:auto;border-radius:9px;display:block;margin:12px 0}.content pre{overflow:auto;background:#060b12;padding:13px;border-radius:9px}.content code{font-family:monospace;background:#1b2d3e;padding:2px 5px;border-radius:4px}.content pre code{background:none}.content a{color:#75cfe5}.content h1,.content h2,.content h3{line-height:1.4;margin:18px 0 8px}.content blockquote{border-left:3px solid #3caac1;padding:6px 12px;background:#132433}
.reader.html-mode{padding:0;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.reader.html-mode header{padding:12px 18px;flex:0 0 auto;background:#101b29}
.reader.html-mode header h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader.html-mode #content{padding:0;flex:1;min-height:0;overflow:hidden}
.html-viewer{width:100%;height:100%;min-height:600px;border:0;display:block;background:white}
.html-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#101b29;border-bottom:1px solid #29394d}
.html-toolbar .muted{margin-right:auto}
.reader:not(.html-mode) #content{overflow:auto}
@media(max-width:800px){.reader.html-mode{height:85vh}.html-viewer{min-height:500px}}
</style></head><body><div class="app">
<aside class="side"><div class="brand">❄ <span>BINGYU</span> ARCHIVE<div class="muted">个人 AI 对话档案馆</div></div>
<div class="nav"><button class="btn primary" id="all">全部对话 <b id="count">0</b></button><button class="btn" id="favs">我的收藏</button><button class="btn" id="uncat">未分类</button></div><p class="muted">本地优先 · IndexedDB 存储</p>
<div class="bottom"><button class="btn primary" id="import">＋ 导入 ChatGPT JSON / HTML</button><button class="btn" id="backup">导出档案备份</button><button class="btn" id="restore">恢复档案备份</button><a class="btn" href="../" style="text-align:center;text-decoration:none">返回冰屿首页</a><small class="muted">请定期导出备份。当前版本不上传你的对话。</small></div></aside>
<section class="list"><h2>对话档案</h2><input class="search" id="search" placeholder="搜索标题、正文、标签"><select id="categoryFilter" style="width:100%;margin-top:8px"><option value="">全部分类</option><option>工作与商业</option><option>学习与研究</option><option>创意与设计</option><option>生活与日常</option><option>编程与技术</option><option>其他</option><option>未分类</option></select><p class="muted" id="stats">等待导入</p><div id="entries" class="empty">导入 ChatGPT 数据导出包中的 conversations.json</div></section>
<main class="reader"><header><h1 id="title">欢迎来到冰屿 AI 档案馆</h1><button class="btn" id="metaEdit" disabled>分类 / 标签</button><button class="btn" id="fav" disabled>☆</button><button class="btn" id="del" disabled>删除</button></header><div id="content" class="empty">导入对话后，可在这里阅读、搜索、收藏和归档。<p><button class="btn primary" onclick="document.getElementById('file').click()">开始导入</button></p></div></main></div>
<input id="file" type="file" accept=".json,.html,.htm" multiple hidden><input id="restorefile" type="file" accept=".json" hidden>
<script>
const $=id=>document.getElementById(id);let db,data=[],active=null,mode='all',query='';
function openDB(){return new Promise((ok,no)=>{let r=indexedDB.open('bingyuArchive',1);r.onupgradeneeded=()=>r.result.createObjectStore('chats',{keyPath:'id'});r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>no(r.error)})}
function put(x){return new Promise(ok=>{let r=db.transaction('chats','readwrite').objectStore('chats').put(x);r.onsuccess=ok})}
function getAll(){return new Promise(ok=>{let r=db.transaction('chats').objectStore('chats').getAll();r.onsuccess=()=>ok(r.result)})}
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function txt(m){let p=m.content?.parts||[];return p.map(v=>{if(typeof v==='string')return v;if(v?.text)return v.text;if(v?.image_url?.url)return '\n![图片]('+v.image_url.url+')\n';if(v?.url&&/^https?:/.test(v.url))return '\n![图片]('+v.url+')\n';if(v?.asset_pointer)return '[媒体附件：'+v.asset_pointer+']';return '[图片或附件：请同时保留官方导出包中的媒体文件]'}).join('\n')}
function norm(c){let ms=[];if(c.mapping){for(let n of Object.values(c.mapping)){let m=n.message;if(m){let t=txt(m);if(t)ms.push({role:m.author?.role||'assistant',text:t,time:m.create_time})}}ms.sort((a,b)=>(a.time||0)-(b.time||0))}else if(c.messages)ms=c.messages.map(m=>({role:m.role||'assistant',text:typeof m.content==='string'?m.content:txt(m),time:m.created_at}));return{id:String(c.id||c.conversation_id||crypto.randomUUID()),title:c.title||'未命名对话',source:'ChatGPT',created:c.create_time||Date.now()/1000,updated:c.update_time||Date.now()/1000,messages:ms,favorite:false,category:'未分类',tags:[]}}
function render(){let a=data.filter(x=>(mode==='favs'?x.favorite:mode==='uncat'?x.category==='未分类':true)&&(!$('categoryFilter')||!$('categoryFilter').value||x.category===$('categoryFilter').value)&&((x.title+' '+x.messages.map(m=>m.text).join(' ')+' '+(x.tags||[]).join(' ')+' '+(x.category||'')).toLowerCase().includes(query)));a.sort((x,y)=>y.updated-x.updated);$('count').textContent=data.length;$('stats').textContent='显示 '+a.length+' / '+data.length+' 条';$('entries').className='';$('entries').innerHTML=a.length?a.map(x=>'<div class="entry '+(active===x.id?'active':'')+'" data-id="'+esc(x.id)+'"><b>'+ (x.favorite?'★ ':'')+esc(x.title)+'</b><small>'+x.messages.length+' 条消息 · '+new Date(x.updated*1000).toLocaleDateString()+'</small></div>').join(''):'<div class="empty">没有匹配的对话</div>';document.querySelectorAll('.entry').forEach(e=>e.onclick=()=>show(e.dataset.id))}
function show(id){active=id;let x=data.find(v=>v.id===id);if(!x)return;let reader=document.querySelector('.reader');reader.classList.toggle('html-mode',!!x.html);$('title').textContent=x.title;$('fav').disabled=$('del').disabled=$('metaEdit').disabled=false;$('fav').textContent=x.favorite?'★':'☆';$('content').className='';if(x.html){$('content').innerHTML='<div class="html-toolbar"><span class="muted">原始 HTML · 本地保存 · 隔离预览</span><button class="btn" id="downloadOriginal">下载原文件</button><button class="btn" id="reloadOriginal">重新载入</button></div><iframe class="html-viewer" id="htmlFrame" title="原始 HTML 文档" sandbox="allow-scripts allow-forms allow-popups" referrerpolicy="no-referrer"></iframe>';$('htmlFrame').srcdoc=x.html;$('downloadOriginal').onclick=()=>dl(new Blob([x.html],{type:'text/html;charset=utf-8'}),(x.title||'archive')+'.html');$('reloadOriginal').onclick=()=>{$('htmlFrame').srcdoc='';requestAnimationFrame(()=>$('htmlFrame').srcdoc=x.html)}}else{$('content').innerHTML=x.messages.map(m=>'<article class="msg"><div class="avatar">'+(m.role==='user'?'你':'AI')+'</div><div><b>'+(m.role==='user'?'你':'AI 助手')+'</b><small> '+fmtArchiveDate(m.time||m.created)+'</small><div class="content">'+renderArchiveMarkdown(m.text||'')+'</div>'+(m.attachments?.length?'<div class="tag">📎 '+m.attachments.length+' 个附件</div>':'')+'</div></article>').join('')||'<div class="empty">这条对话没有可显示的消息</div>';}render()}
async function refresh(){data=await getAll();render();if(data.length&&!active)show(data[0].id);if(!data.length){document.querySelector('.reader').classList.remove('html-mode');active=null;$('fav').disabled=$('del').disabled=$('metaEdit').disabled=true;$('fav').textContent='☆';$('title').textContent='选择对话';$('content').className='empty';$('content').textContent='导入对话后，可在这里阅读、搜索、收藏和归档。'}}
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let n=0;try{for(let f of e.target.files){if(f.name.toLowerCase().endsWith('.json')){let j=JSON.parse(await f.text()),a=Array.isArray(j)?j:j.conversations||[];for(let c of a){let x=norm(c);if(x.messages.length){await put(x);n++}}}else{let html=await f.text();await put({id:crypto.randomUUID(),title:f.name.replace(/\.html?$/i,''),source:'HTML 原貌存档',created:Date.now()/1000,updated:Date.now()/1000,messages:[],html,category:'未分类',tags:['HTML'],favorite:false});n++}}await refresh();alert('导入 '+n+' 条。HTML 文件将以原始网页方式阅读。')}catch(err){alert('导入失败：'+err.message)}e.target.value=''}
$('search').oninput=e=>{query=e.target.value.toLowerCase();render()};if($('categoryFilter'))$('categoryFilter').onchange=render;$('all').onclick=()=>{mode='all';render()};$('favs').onclick=()=>{mode='favs';render()};$('uncat').onclick=()=>{mode='uncat';render()};
$('fav').onclick=async()=>{let x=data.find(v=>v.id===active);x.favorite=!x.favorite;await put(x);await refresh();show(active)};$('del').onclick=async()=>{if(confirm('删除这条对话？')){await new Promise(ok=>{let r=db.transaction('chats','readwrite').objectStore('chats').delete(active);r.onsuccess=ok});active=null;$('content').innerHTML='已删除';$('title').textContent='选择对话';await refresh()}};
function dl(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('backup').onclick=()=>dl(new Blob([JSON.stringify({format:'bingyu-archive',conversations:data},null,2)],{type:'application/json'}),'bingyu-archive-backup.json');$('restore').onclick=()=>$('restorefile').click();$('restorefile').onchange=async e=>{let j=JSON.parse(await e.target.files[0].text());for(let x of j.conversations||[])await put(x);await refresh();alert('备份恢复完成')};
function fmtArchiveDate(t){if(!t)return '';let d=new Date(typeof t==='number'?t*1000:t);return isNaN(d)?'':d.toLocaleString('zh-CN')}
function renderArchiveMarkdown(s){let x=esc(s);x=x.replace(/!\[([^\]]*)\]\((https?:[^\s)]+)\)/g,'<img alt="$1" src="$2" loading="lazy">');x=x.replace(/\x60{3}([\w-]*)\n([\s\S]*?)\x60{3}/g,function(_,l,c){return '<pre><code>'+c+'</code></pre>'});x=x.replace(/\x60([^\x60]+)\x60/g,'<code>$1</code>').replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/\[(.*?)\]\((https?:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');x=x.replace(/^[-*] (.*)$/gm,'<li>$1</li>');x=x.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');return x.split(/\n{2,}/).map(p=>/^<(h[1-3]|pre|ul|img)/.test(p)?p:'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}
$('metaEdit').onclick=()=>{let x=data.find(v=>v.id===active);if(!x)return;let cat=prompt('输入分类（工作与商业、学习与研究、创意与设计、生活与日常、编程与技术、其他）',x.category||'未分类');if(cat===null)return;let tags=prompt('输入标签，用逗号分隔',(x.tags||[]).join(', '));if(tags===null)return;x.category=cat.trim()||'未分类';x.tags=tags.split(',').map(t=>t.trim()).filter(Boolean);put(x).then(refresh)};
openDB().then(refresh).catch(e=>alert('本地数据库错误：'+e.message));
</script></body></html>
